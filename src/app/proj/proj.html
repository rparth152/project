<mat-toolbar color="primary" class="navbar">
    <span class="title">Project Report</span>

    <span class="spacer"></span>

    <button mat-raised-button color="accent" (click)="exportCSV()">Export CSV</button>
    <button mat-raised-button color="warn" (click)="exportPDF()">Export PDF</button>
</mat-toolbar>


<div class="dashboard">

    <!-- TOP GRID -->
    <div class="top-grid">

        <!-- LEFT CARDS -->
        <div class="card-section">

            <mat-card class="stat-card green">
                <p>Active Projects</p>
                <h2>{{ active }}</h2>
            </mat-card>

            <mat-card class="stat-card red">
                <p>Inactive Projects</p>
                <h2>{{ inactive }}</h2>
            </mat-card>

        </div>

        <mat-card class="chart-card" style="width: 800px; height: 400px;">
            <h3>Project Status</h3>
            <canvas id="ProjChart"></canvas>
        </mat-card>
    </div>

    <mat-card class="table-card">
        <h3>Projects List</h3>
    
        <table mat-table [dataSource]="Projdata">
    
            <!-- Project ID -->
            <ng-container matColumnDef="projectId">
                <th mat-header-cell *matHeaderCellDef>ID</th>
                <td mat-cell *matCellDef="let p">{{ p.projectId }}</td>
            </ng-container>
    
            <!-- Project Name -->
            <ng-container matColumnDef="projectName">
                <th mat-header-cell *matHeaderCellDef>Name</th>
                <td mat-cell *matCellDef="let p">{{ p.projectName }}</td>
            </ng-container>
    
            <!-- Deadline -->
            <ng-container matColumnDef="deadline">
                <th mat-header-cell *matHeaderCellDef>Deadline</th>
                <td mat-cell *matCellDef="let p">
                    <span *ngIf="p.deadline !== '0001-01-01T00:00:00'; else noDate">
                        {{ p.deadline | date:'shortDate' }}
                    </span>
                    <ng-template #noDate>Not Set</ng-template>
                </td>
            </ng-container>
    
            <!-- Priority -->
            <ng-container matColumnDef="priority">
                <th mat-header-cell *matHeaderCellDef>Priority</th>
                <td mat-cell *matCellDef="let p">
                    <span class="priority high" *ngIf="p.priority === 'high'">High</span>
                    <span class="priority medium" *ngIf="p.priority === 'medium'">Medium</span>
                    <span class="priority low" *ngIf="p.priority === 'low'">Low</span>
                </td>
            </ng-container>
    
            <!-- Status -->
            <ng-container matColumnDef="status">
                <th mat-header-cell *matHeaderCellDef>Status</th>
                <td mat-cell *matCellDef="let p">
                    <span class="status active" *ngIf="p.status === 'active'">Active</span>
                    <span class="status inactive" *ngIf="p.status !== 'active'">Inactive</span>
                </td>
            </ng-container>
    
            <!-- Header & Rows -->
            <tr mat-header-row *matHeaderRowDef="projectColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: projectColumns;"></tr>
    
        </table>
    </mat-card>

</div>
