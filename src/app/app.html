<canvas id="employeeChart" width="400" height="200"></canvas>
<script>
  const active = Estatus.sactive
  const inactive = Estatus.sinactive
  const total = Estatus.ecount
  const ctx = document.getElementById('employeeChart').getContext('2d');

  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: ['Active', 'Inactive', 'Total'],
      datasets: [{
        label: 'Employee Stats',
        data: [active, inactive, total],

        backgroundColor: [
          'lightgreen',
          'lightred',
          'lightblue'
        ],
        borderColor: [
          'darkgreen',
          'darkred',
          'darkblue'
        ],
        borderWidth: 1
      }]
    },
    options: {
      responsive: true,
      scales: {
        y: {
          beginAtZero: true
        }
      }
    }
  });
</script>
